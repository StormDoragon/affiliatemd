name: affiforge

x-api: &api
  build:
    context: ..
    dockerfile: infra/Dockerfile.backend
  image: affiforge-api:local
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://affiforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/affiforge
    REDIS_URL: redis://redis:6379/0
  init: true
  networks: [data, providers]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiforge
      POSTGRES_DB: affiforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiforge -d affiforge"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *api
    restart: unless-stopped
    networks: [data, providers, app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    init: true
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    networks: [app, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/users/registration',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_HTTP_PORT:-3000}:80"
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_HTTPS_PORT:-3443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy

networks:
  edge: {}
  providers: {}
  app:
    internal: true
  data:
    internal: true

volumes:
  postgres:
  redis:
  caddy_data:
  caddy_config:
