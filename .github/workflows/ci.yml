name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiforge
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: affiforge
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: affiforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiforge -d affiforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: affiforge/backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - if: matrix.database == 'sqlite'
        run: python -m pytest
      - if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://affiforge:test-only@127.0.0.1:5432/affiforge_test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiforge/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: affiforge/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: cp affiforge/.env.example affiforge/.env
      - run: docker compose --env-file affiforge/.env -f affiforge/infra/docker-compose.yml up --build --wait --wait-timeout 180
      - run: |
          set -eu
          curl --fail --retry 5 --retry-connrefused -sS http://localhost:3000/ -o /dev/null
          curl --fail -sS http://localhost:3000/api/users/registration | grep -q '"enabled":true'
          test "$(curl -sS -w '%{http_code}' -o /dev/null http://localhost:3000/api/earnings/dashboard)" = 401
          curl --fail -sS -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","full_name":"Smoke Test","password":"compose-smoke-only"}' \
            http://localhost:3000/api/users/register
          curl --fail -sS -c /tmp/affiforge-cookie -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"compose-smoke-only"}' \
            http://localhost:3000/api/users/token
          curl --fail -sS -b /tmp/affiforge-cookie http://localhost:3000/api/earnings/dashboard | grep -q '"posts_count":0'
      - if: failure()
        run: docker compose --env-file affiforge/.env -f affiforge/infra/docker-compose.yml logs
      - if: always()
        run: docker compose --env-file affiforge/.env -f affiforge/infra/docker-compose.yml down
